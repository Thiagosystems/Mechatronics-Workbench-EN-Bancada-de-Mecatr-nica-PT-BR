<title>Bancada Mecatrônica — Thiagosystems</title>
<style>

.subs{margin-top:14px}

D.oficina.s.aprenda={nome:'Aprenda a operar',k:[
G('Como operar o torno, passo a passo',['Coloque óculos, prenda o cabelo e tire anéis, relógio e luvas. Máquina desligada.','Fixe a peça na placa apertando as garras nos furos da chave, alternando entre eles. Retire a chave e deixe longe do mandril.','Se a peça sobrar mais de 3 vezes o diâmetro, apoie a ponta no contraponto.','Prenda a ferramenta com o menor balanço possível e com a ponta na altura do centro da peça.','Calcule a rotação na calculadora do Torno e selecione na caixa de velocidades (máquina parada).','Aproxime a ferramenta girando o volante à mão, sem ligar, para conferir que nada bate.','Ligue, faça um toque leve na peça para zerar o anel graduado e comece a usinar.','Meça com a máquina parada e o mandril completamente parado.','Ao terminar, desligue, espere parar, limpe os cavacos com escova e lubrifique os barramentos.'],'nunca use luvas nem freie o mandril com a mão. Cavaco é cortante e quente: use gancho ou escova.','deixar a chave na placa, ferramenta acima ou abaixo do centro, avanço muito rápido, medir com a peça girando.'),
G('Exercício: facear e cilindrar um tarugo',['Fixe um tarugo de alumínio de 30 mm, saindo uns 40 mm da placa.','Para Vc 100 m/min e D 30 mm, a rotação fica perto de 1060 rpm (confira na calculadora).','Faceamento: encoste a ferramenta na face e avance o carro transversal do centro para fora, sem parar, com avanço constante.','Cilindragem: encoste a ferramenta na lateral, zere o anel e recue o carro longitudinal sem mexer no transversal.','Para passar de 30 para 28 mm, tire 1 mm de raio: veja se o seu anel marca raio ou diâmetro. Faça em 2 passes.','Termine com um passe de acabamento fino (0,1 a 0,2 mm) e avanço mais lento.','Meça com paquímetro e compare com 28 mm.'],'confira a fixação antes de ligar e nunca deixe o carro chegar perto da placa girando.'),
G('Como operar a fresadora',['Use óculos, sem luvas e sem mangas soltas.','Fixe a peça na morsa com calços paralelos, ou com grampos, saindo o mínimo possível.','Monte a fresa na pinça ou no porta-fresas com balanço curto e aperte bem.','Calcule rotação e avanço nas calculadoras da Fresadora.','Zere a peça: toque a fresa de leve na lateral para X e Y e na face de cima para Z (use um papel fino para sentir o contato).','Escolha o sentido: concordante dá melhor acabamento se a máquina não tem folga; convencional é o mais seguro em máquina manual.','Usine em vários passes de profundidade pequenos, em vez de um passe fundo.','Retire cavacos com pincel ou ar, com a fresa parada.'],'nunca meça nem limpe com a fresa girando. Prenda sempre a peça: ela pode ser arrancada.','bater a fresa na morsa, avançar rápido demais, fresa mal apertada e esquecer de travar os eixos que não estão em uso.'),
G('Como usar a furadeira de bancada',['Óculos, cabelo preso, sem luvas.','Desligue da tomada e troque a correia nas polias: rotação alta para broca pequena, baixa para broca grande.','Prenda a peça na morsa e a morsa na mesa (ou com grampo).','Marque o centro com punção. Acima de 10 mm, faça antes um furo piloto pequeno.','Ajuste a altura da mesa e o batente de profundidade.','Ligue, desça a broca sem forçar e suba de vez em quando para soltar o cavaco.','Retire a rebarba com escareador ou broca maior à mão.'],'nunca segure a peça com a mão. Retire a chave do mandril antes de ligar.','rotação alta demais em broca grande, forçar a broca, peça solta que gira junto.'),
G('Como ligar e testar um motor trifásico',['Leia a placa: tensões (ex.: 220/380 V), corrente, rpm, cosφ e grau IP.','Escolha a ligação: rede de 380 V = estrela; rede de 220 V = triângulo (para motor 220/380).','Estrela: una U2, V2 e W2. Triângulo: ligue U1 a W2, V1 a U2 e W1 a V2. Confira o esquema colado na tampa da caixa.','Conecte as três fases da rede nos terminais e o terra (PE) na carcaça.','Ajuste o relé térmico ou disjuntor-motor na corrente nominal da placa.','Dê um toque rápido para ver o sentido. Se estiver invertido, desenergize e troque duas fases.','Meça a corrente com alicate amperímetro: em regime deve ficar abaixo da nominal.'],'desenergize, trave o disjuntor e confirme com o multímetro que não há tensão antes de mexer na caixa de ligação.','ligação errada da tensão (queima o motor), esquecer o terra e regular o térmico acima da corrente da placa.'),
G('Como operar uma máquina CNC',['Confira porta, proteções e o botão de emergência ao alcance da mão.','Ligue a máquina e faça o referenciamento (home) dos eixos.','Fixe a peça e monte a ferramenta. Meça o comprimento dela para o offset (G43).','Defina o zero da peça (G54) em X, Y e Z.','Carregue o programa e rode a simulação ou um teste no ar, com o Z levantado.','Rode a primeira vez com o rápido em 25% e o avanço reduzido, bloco a bloco.','Observe o som e o cavaco, ajuste o avanço e a rotação e mantenha a mão perto da emergência.','No fim, volte ao home e limpe a máquina.'],'nunca abra a porta com o fuso girando nem entre no curso dos eixos.','unidade errada (G20 no lugar de G21), esquecer o offset da ferramenta e começar com o rápido a 100%.'),
G('Como ler um programa G-code',['Linhas com ponto e vírgula ou parênteses são comentários.','G21 G90 define milímetros e coordenadas absolutas. G54 escolhe o zero da peça.','M06 T1 troca para a ferramenta 1. M03 S8000 liga o fuso a 8000 rpm.','G00 é deslocamento rápido, sem cortar. Só use com a ferramenta afastada da peça.','G01 corta em linha reta e precisa de F (avanço em mm/min).','G02 e G03 fazem arcos, com centro em I, J.','M05 para o fuso e M30 termina o programa.','Antes de rodar, veja o percurso no simulador e confira a altura de Z.'],'um G00 rente à peça pode bater e quebrar a ferramenta.','','')
]};
D.eletrica.s.aprenda={nome:'Aprenda a usar',k:[
G('Como usar o multímetro',['Encaixe a ponteira preta em COM e a vermelha em VΩ.','Tensão: gire para V~ (CA) ou V⎓ (CC) e meça em paralelo, com o circuito ligado.','Continuidade: com o circuito desligado, encoste as pontas; o bipe indica que há ligação.','Resistência: componente fora do circuito e desenergizado.','Corrente: mova a ponteira vermelha para a entrada A e ligue o multímetro em série com a carga.','Comece sempre pela escala maior se não souber o valor.'],'nunca meça corrente em paralelo nem resistência com circuito energizado: queima o multímetro e pode causar acidente.','deixar a ponteira na entrada de corrente e medir tensão (curto-circuito).'),
G('Como montar um circuito na protoboard',['As duas fileiras laterais são de alimentação (+ e −), ligadas em toda a extensão.','No meio, cada coluna de 5 furos está ligada entre si; o vão central separa os dois lados.','Ligue o + e o − da fonte nas fileiras laterais.','Coloque um resistor de 220 a 330 Ω em série com o LED.','A perna longa do LED (ânodo) vai para o lado do +.','Confira tudo antes de ligar e só então conecte a fonte.'],'não ultrapasse a tensão dos componentes e nunca ligue a protoboard direto na rede elétrica.','LED sem resistor e fio no furo errado.'),
G('Como ler um esquema de comando elétrico',['Separe o circuito de potência (motor e contatos principais) do de comando (botões, bobinas, sinaleiros).','No comando, o fluxo vai da fase (linha de cima) até o neutro ou 0 V (linha de baixo).','Botões e contatos aparecem na posição de repouso: NA (aberto) e NF (fechado).','Cada bobina (KM1) comanda os contatos de mesmo nome espalhados pelo esquema.','O contato NA em paralelo com o botão liga é o selo.','Um NF de KM2 em série com KM1 (e vice-versa) é o intertravamento da reversora.','Use o simulador da aba Automação para testar cada caso.'],'antes de ligar um painel real, confira as ligações com o circuito desenergizado.','confundir NA com NF e ligar bobina na tensão errada.'),
G('Como soldar componentes',['Aqueça o ferro a cerca de 350 °C e limpe a ponta na esponja úmida.','Encoste a ponta ao mesmo tempo no terminal e na ilha da placa.','Depois de 1 ou 2 s, encoste o fio de solda no terminal, não na ponta do ferro.','Retire a solda e, em seguida, o ferro. Deixe esfriar sem mexer.','A solda boa fica brilhante e em forma de cone; corte o excesso do terminal.'],'ferro quente: apoie no suporte, ventile o ambiente e lave as mãos depois de usar solda com chumbo.','solda fria (opaca e sem aderir) e aquecer demais e descolar a trilha.'),
G('Roteiro para dimensionar cabo e disjuntor',['Calcule a corrente da carga (P ÷ V para monofásico; use a calculadora trifásica).','Escolha a seção do cabo pela tabela de corrente aproximada, com folga.','Confira a queda de tensão na calculadora de cabo (procure ficar em torno de 4% ou menos).','Escolha um disjuntor cuja corrente fique acima da corrente da carga e abaixo da capacidade do cabo.','Em áreas molhadas e tomadas, use também o DR.','Para um projeto real, confirme na NBR 5410 ou com um profissional habilitado.'],'cabo fino demais aquece e pode causar incêndio; não troque o disjuntor por um maior para "parar de desarmar".','')
]};
D.pneumatica.s.aprenda={nome:'Aprenda a montar',k:[
G('Como montar um circuito pneumático',['Comece pela fonte: compressor, depois a unidade de conservação (filtro, regulador e lubrificador).','Regule o regulador em torno de 6 bar, ou menos para os primeiros testes.','Ligue a alimentação (via 1) das válvulas com a mangueira do tamanho certo e engates rápidos.','Ligue as saídas 2 e 4 da válvula nas duas câmaras do cilindro.','Coloque reguladores de fluxo unidirecionais para controlar a velocidade.','Com o ar desligado, confira cada conexão.','Abra o ar devagar e teste com baixa pressão (2 bar). Suba a pressão depois.'],'despressurize o sistema antes de trocar qualquer conexão. Nunca aponte o ar para pessoas.','mangueira mal encaixada, escapes tampados e regulador de fluxo instalado ao contrário.'),
G('Como ler um diagrama pneumático',['Comece pelo cilindro e siga as linhas até a válvula que o comanda.','Cada válvula é desenhada na posição de repouso.','Os números das portas são padronizados: 1 pressão, 2 e 4 saídas, 3 e 5 escapes, 12 e 14 pilotos.','Veja o acionamento: botão, rolete, piloto ou solenoide.','Nas sequências, marque os sensores a0 e a1 (fim de curso recuado e avançado).','Use o simulador de sequência para conferir o diagrama trajeto-passo.'],'ao testar um circuito novo, suba a pressão aos poucos.',''),
G('Manutenção e diagnóstico de vazamentos',['Drene o filtro todos os dias.','Complete o óleo do lubrificador quando ele estiver em uso.','Passe água com sabão nas conexões: bolhas mostram o vazamento.','Se o cilindro fica lento, verifique pressão, reguladores de fluxo e filtro entupido.','Troque vedações desgastadas e mangueiras ressecadas.'],'desligue e alivie a pressão antes de qualquer manutenção.','')
]};
D.ard.s.aprenda={nome:'Aprenda a programar',k:[
G('Primeiros passos com Arduino',['Instale a Arduino IDE e conecte a placa ao computador com um cabo de dados.','Em Ferramentas, escolha a placa e a porta.','Abra Arquivo > Exemplos > Basics > Blink.','Clique em Verificar e depois em Carregar (upload).','Abra o Monitor Serial e ajuste a velocidade igual à do Serial.begin.','Mude o valor de delay() e carregue de novo para ver o efeito.'],'nunca ligue mais de 5 V nos pinos do Arduino Uno nem passe de 20 mA por pino.','porta errada, cabo que só carrega e baud rate diferente.'),
G('Como configurar o ESP32 na Arduino IDE',['Em Preferências, adicione o endereço de placas da Espressif e instale "esp32" no Gerenciador de Placas.','Escolha a placa "ESP32 Dev Module" e a porta.','Se o upload travar em "Connecting...", segure o botão BOOT até começar.','Use 115200 no Serial.begin.','Os pinos aceitam no máximo 3,3 V. Evite os pinos de boot (0, 2, 12, 15) para botões.','ADC2 não funciona com o Wi-Fi ligado: use pinos ADC1 (32 a 39).'],'não aplique 5 V nos pinos do ESP32.','usar GPIO6 a GPIO11 (são da flash).'),
G('Seu primeiro circuito: LED e botão',['Ligue o LED com um resistor de 220 Ω no pino escolhido e no GND.','Ligue o botão entre o pino de entrada e o GND.','Use pinMode(pino, INPUT_PULLUP): o botão apertado lê LOW.','Copie o código do Gerador de código (Botão com pull-up e Piscar LED).','Combine: if (digitalRead(BOTAO) == LOW) acende o LED.','Teste e mude o comportamento para alternar o LED a cada aperto.'],'sem resistor o LED queima e pode danificar o pino.',''),
G('Como usar o gráfico ao vivo (Web Serial)',['Grave no Arduino/ESP32 o modelo "Ler sensor analógico" do gerador.','Feche o Monitor Serial da IDE (só um programa usa a porta por vez).','Abra este app no Chrome ou Edge, em https ou localhost.','Na aba Gráfico ao vivo, escolha o mesmo baud e clique em Conectar.','Selecione a porta na janela do navegador.','Para várias curvas, imprima os valores separados por vírgula.','Sem placa, use "Simular sinal" para ver como fica.'],'não conecte sinais acima da tensão dos pinos.','baud diferente do Serial.begin e Monitor Serial aberto ao mesmo tempo.'),
G('Noções de C/C++ para microcontroladores',['Todo programa tem setup(), que roda uma vez, e loop(), que repete para sempre.','Declare variáveis com tipo: int, float, bool, uint8_t.','Decisões com if/else e repetições com for e while.','delay() trava tudo; para fazer várias coisas, use millis() e compare o tempo.','Divida em funções pequenas com nomes claros.','Use os operadores bit a bit da aba C e C++ para mexer em registradores.'],'teste cada parte pequena antes de juntar o projeto todo.','')
]};

const ITR=[3,6,10,18,30,50,80,120,180,250,315,400,500];
const ITT={5:[4,5,6,8,9,11,13,15,18,20,23,25,27],6:[6,8,9,11,13,16,19,22,25,29,32,36,40],7:[10,12,15,18,21,25,30,35,40,46,52,57,63],8:[14,18,22,27,33,39,46,54,63,72,81,89,97],9:[25,30,36,43,52,62,74,87,100,115,130,140,155],10:[40,48,58,70,84,100,120,140,160,185,210,230,250],11:[60,75,90,110,130,160,190,220,250,290,320,360,400]};
const HL=['D','E','F','G','H','JS'],SL=['d','e','f','g','h','js','k','m','n'];
const ix=D=>{const i=ITR.findIndex(x=>D<=x);return i<0?ITR.length-1:i};
const itv=(g,D)=>ITT[g][ix(D)];
const dmed=D=>{const i=ix(D);return Math.sqrt((i?ITR[i-1]:1)*ITR[i])};
const shEs={d:x=>-16*Math.pow(x,.44),e:x=>-11*Math.pow(x,.41),f:x=>-5.5*Math.pow(x,.41),g:x=>-2.5*Math.pow(x,.34),h:()=>0};
const shaftDev=(L,g,D)=>{const it=itv(g,D),dm=dmed(D);let es,ei;
 if(L in shEs){es=shEs[L](dm);ei=es-it}
 else if(L=='js'){es=it/2;ei=-it/2}
 else if(L=='k'){ei=g<=7?.6*Math.cbrt(dm):0;es=ei+it}
 else if(L=='m'){ei=itv(7,D)-itv(6,D);es=ei+it}
 else{ei=5*Math.pow(dm,.34);es=ei+it}
 return[Math.round(es),Math.round(ei)]};
const holeDev=(L,g,D)=>{const it=itv(g,D),dm=dmed(D);if(L=='H')return[it,0];if(L=='JS')return[Math.round(it/2),-Math.round(it/2)];const ei=-shEs[L.toLowerCase()](dm);return[Math.round(ei+it),Math.round(ei)]};

TPL['Motor de passo (A4988)']=p=>`const int STEP = ${p};
const int DIR  = ${(+p)+1};

void setup() {
  pinMode(STEP, OUTPUT);
  pinMode(DIR, OUTPUT);
}

void loop() {
  digitalWrite(DIR, HIGH);          // sentido horário
  for (int i = 0; i < 200; i++) {   // 200 passos = 1 volta (motor de 1,8°)
    digitalWrite(STEP, HIGH);
    delayMicroseconds(800);
    digitalWrite(STEP, LOW);
    delayMicroseconds(800);
  }
  delay(1000);
  digitalWrite(DIR, LOW);           // sentido anti-horário
  for (int i = 0; i < 200; i++) {
    digitalWrite(STEP, HIGH);
    delayMicroseconds(800);
    digitalWrite(STEP, LOW);
    delayMicroseconds(800);
  }
  delay(1000);
}`;
TPL['Sensor ultrassônico (HC-SR04)']=p=>`const int TRIG = ${p};
const int ECHO = ${(+p)+1};

void setup() {
  Serial.begin(115200);
  pinMode(TRIG, OUTPUT);
  pinMode(ECHO, INPUT);
}

void loop() {
  digitalWrite(TRIG, LOW);
  delayMicroseconds(2);
  digitalWrite(TRIG, HIGH);
  delayMicroseconds(10);
  digitalWrite(TRIG, LOW);
  long tempo = pulseIn(ECHO, HIGH, 30000);  // microssegundos
  float cm = tempo * 0.0343 / 2;            // ida e volta
  Serial.println(cm);
  delay(100);
}`;
TPL['Servidor web (ESP32)']=p=>`#include <WiFi.h>
#include <WebServer.h>

const int LED = ${p};
WebServer servidor(80);

void setup() {
  Serial.begin(115200);
  pinMode(LED, OUTPUT);
  WiFi.begin("SUA_REDE", "SUA_SENHA");
  while (WiFi.status() != WL_CONNECTED) delay(500);
  Serial.println(WiFi.localIP());

  servidor.on("/", []() {
    servidor.send(200, "text/html", "<a href='/on'>Ligar</a> | <a href='/off'>Desligar</a>");
  });
  servidor.on("/on", []() {
    digitalWrite(LED, HIGH);
    servidor.sendHeader("Location", "/");
    servidor.send(302);
  });
  servidor.on("/off", []() {
    digitalWrite(LED, LOW);
    servidor.sendHeader("Location", "/");
    servidor.send(302);
  });
  servidor.begin();
}

void loop() {
  servidor.handleClient();
}`;
TPL['MQTT (ESP32)']=p=>`#include <WiFi.h>
#include <PubSubClient.h>

const int LED = ${p};
WiFiClient rede;
PubSubClient mqtt(rede);

void aoReceber(char* topico, byte* dados, unsigned int tam) {
  digitalWrite(LED, (char)dados[0] == '1' ? HIGH : LOW);
}

void setup() {
  pinMode(LED, OUTPUT);
  WiFi.begin("SUA_REDE", "SUA_SENHA");
  while (WiFi.status() != WL_CONNECTED) delay(500);
  mqtt.setServer("broker.hivemq.com", 1883);
  mqtt.setCallback(aoReceber);
}

void loop() {
  if (!mqtt.connected()) {
    if (mqtt.connect("esp32-bancada")) mqtt.subscribe("bancada/led");
    else { delay(2000); return; }
  }
  mqtt.loop();
}`;

 const ins=[...el.querySelectorAll('input')],cv=Q(el,'canvas'),x=cv.getContext('2d'),o=Q(el,'.out');
 const u=()=>{const[Kp,Ki,Kd,sp,tau,K,th]=ins.map(i=>+i.value),ac=getComputedStyle(document.body).getPropertyValue('--ac').trim()||'#ffb020';
  x.clearRect(0,0,720,260);o.innerHTML='';

  const dt=.01,T=15,N=T/dt,dl=Math.round(th/dt),ub=[],ys=[];let y=0,I=0,pe=sp;
  for(let k=0;k<N;k++){const e=sp-y;I+=e*dt;const d=(e-pe)/dt;pe=e;const raw=Kp*e+Ki*I+Kd*d,uc=Math.max(0,Math.min(100,raw));if(raw!==uc)I-=e*dt;ub.push(uc);y+=(K*(k>=dl?ub[k-dl]:0)-y)/tau*dt;ys.push(y)}
  if(!ys.every(Number.isFinite)){o.textContent='A simulação divergiu. Reduza os ganhos.';return}
  const mx=Math.max(...ys),os=Math.max(0,(mx-sp)/sp*100);let ts=0;ys.forEach((v,k)=>{if(Math.abs(v-sp)>.02*sp)ts=k*dt});
  const top=Math.max(110,Math.min(mx*1.1,400)),X0=40,W2=670,H2=230,px=k=>X0+k/N*W2,py=v=>10+H2-Math.max(0,Math.min(top,v))/top*H2;
  x.font='12px sans-serif';x.strokeStyle='#3a2224';x.lineWidth=1;x.strokeRect(X0,10,W2,H2);
  x.setLineDash([5,5]);x.beginPath();x.moveTo(X0,py(sp));x.lineTo(X0+W2,py(sp));x.stroke();x.setLineDash([]);
  [[ub,'#5aa8ff'],[ys,ac]].forEach(([a,c])=>{x.strokeStyle=c;x.lineWidth=2.5;x.beginPath();a.forEach((v,k)=>{if(k%3)return;k?x.lineTo(px(k),py(v)):x.moveTo(px(k),py(v))});x.stroke()});
  x.fillStyle='#a58f8c';x.fillText('setpoint',X0+6,py(sp)-6);x.fillText('0 s',X0,H2+26);x.fillText('15 s',X0+W2-24,H2+26);
  x.fillStyle=ac;x.fillText('processo (PV)',X0+90,H2+26);x.fillStyle='#5aa8ff';x.fillText('saída do controlador (u)',X0+200,H2+26);

const INFO3D={
"Torno mecânico 3D":["A peça é presa na placa, que gira em alta rotação. A ferramenta fica no porta-ferramenta, sobre o carro, que se move ao longo do barramento (longitudinal) e para dentro e para fora (transversal). Quando a ferramenta encosta na peça girando, ela arranca material em forma de cavaco e deixa a peça redonda. O fuso e a vara movem o carro sozinhos, no avanço automático, e o contraponto apoia peças compridas.","É a máquina básica de toda oficina de usinagem. Faz eixos, buchas, polias, flanges, roscas e peças de reposição. Na manutenção industrial recupera peças gastas ou fabrica a peça que parou a linha. Na produção em série, foi em grande parte substituído pelo torno CNC."],
"Centro de usinagem CNC vertical 3D":["O computador lê o programa em G-code e move os eixos com motores e fusos de esferas: a mesa anda em X e Y e o cabeçote sobe e desce em Z. O fuso gira a ferramenta e o magazine troca a ferramenta sozinho. O refrigerante lava o cavaco e esfria o corte, e a cabine protege o operador.","É a máquina mais usada para peças complexas: moldes, carcaças, suportes e componentes de automóveis, aviões e equipamentos médicos. Depois de programada, repete a mesma peça milhares de vezes com a mesma medida, e várias ferramentas trabalham em uma única fixação."],
"Motor trifásico 3D":["Três bobinas no estator recebem três correntes defasadas de 120°. Juntas, criam um campo magnético que gira. Esse campo induz corrente nas barras do rotor em gaiola, e o rotor é arrastado atrás do campo, um pouco mais devagar (o escorregamento). Não há escovas nem contatos, por isso o motor é simples e durável. O ventilador da traseira resfria a carcaça.","É o motor mais usado da indústria: bombas, ventiladores, compressores, esteiras, misturadores e máquinas-ferramenta. Liga direto na rede e, com inversor de frequência, passa a ter a rotação controlada, o que economiza energia."],
"Furadeira de bancada 3D":["O motor gira o mandril por meio de correia e polias. Ao puxar a alavanca, o quill desce e a broca entra na peça presa na morsa. A mesa sobe e desce na coluna para ajustar a altura, e trocar a correia de polia muda a rotação: brocas grandes pedem rotação menor.","Serve para furos simples em chapas, perfis e blocos: montagem de estruturas, serralheria, marcenaria e manutenção. Não substitui a fresadora quando é preciso boa precisão de posição."],
"Fresadora 3D":["A fresa gira no fuso e a peça, presa na morsa sobre a mesa, se move sob ela. A mesa anda em X, o carro em Y e o joelho sobe e desce em Z, com volantes manuais e leitor digital. Cada dente da fresa arranca um pedaço pequeno de material.","Faz superfícies planas, rasgos, ressaltos, furos precisos e formas. É a base do ferramental: moldes, gabaritos, dispositivos e peças únicas. Em produção maior, é substituída pelo centro de usinagem CNC."],
"Torno CNC 3D":["O programa comanda o eixo Z (ao longo da peça) e o eixo X (para dentro e para fora). A peça gira na placa e a torre de ferramentas posiciona a ferramenta certa: desbaste, acabamento, rosca ou corte. A placa é acionada por sistema hidráulico ou pneumático, e o contraponto apoia peças compridas.","Produz eixos, pinos, buchas, conexões, parafusos especiais e outras peças redondas em série, para os setores automotivo, de hidráulica, de petróleo e de eletrodomésticos. Com alimentador de barras, trabalha quase sem operador."],
"Cilindro de dupla ação 3D":["O ar comprimido entra por um dos lados e empurra o êmbolo. Para avançar, a válvula 5/2 leva o ar à câmara traseira e libera a dianteira para a atmosfera. Para recuar, ela inverte. A força é a pressão vezes a área do êmbolo, e a velocidade depende da vazão de ar. Sensores magnéticos detectam o ímã do êmbolo e avisam o CLP onde ele está.","É o músculo da automação: prende, empurra, levanta, posiciona e separa peças em máquinas de embalagem, montagem e esteiras. É rápido, limpo e barato, mas não serve para forças muito grandes. Nesses casos usa-se a hidráulica."],
"Prensa hidráulica 3D":["Uma bomba envia óleo ao cilindro. Como o óleo praticamente não se comprime, a pressão empurra o êmbolo com muita força: F = pressão × área. O cabeçote desce com o punção e a peça é conformada entre o punção e a matriz. A válvula limitadora protege contra excesso de pressão e a barreira de luz protege o operador.","Estampa, dobra e repuxa chapas, monta rolamentos e buchas por interferência, endireita eixos e compacta materiais. Está em funilarias, fábricas de autopeças, fundições e na manutenção pesada."],
"Retificadora plana 3D":["Um rebolo, que é um disco abrasivo, gira em alta rotação e a peça, presa na placa magnética, vai e volta sob ele. A cada passada o rebolo desce centésimos de milímetro. O refrigerante evita queimar a peça e leva embora as partículas. De tempos em tempos o rebolo precisa ser dressado, isto é, reafiado.","Dá o acabamento fino em superfícies planas e dimensões exatas (± 0,005 mm ou menos): matrizes, moldes, calços, lâminas e peças temperadas, que são duras demais para a ferramenta de corte comum."],
"Impressora 3D (cartesiana) 3D":["O filamento é empurrado pela extrusora até o bico aquecido, derrete e é depositado em camadas finas. A mesa se move em Y, o bico em X e o pórtico sobe em Z a cada camada. Um software fatiador transforma o modelo 3D em G-code com todos os movimentos, e o ventilador esfria cada camada para ela endurecer.","Faz protótipos, gabaritos, dispositivos de montagem, peças de reposição e ferramentas sob medida. Reduz o tempo e o custo de testar um projeto antes de produzi-lo."],
"Robô cartesiano (pórtico) 3D":["Três eixos lineares perpendiculares (X, Y e Z) movem a garra em linhas retas. Cada um tem motor, fuso ou correia e trilho. O controlador calcula as posições e a garra pneumática pega e solta a peça. Por ser simples, é preciso, fácil de programar e barato.","Aparece em paletização, carga e descarga de máquinas, pick and place em embalagem, montagem eletrônica, dosagem e laboratórios. Trabalha bem em uma área retangular e com cargas leves ou médias."],
"Braço robótico 3D":["Cada junta é um motor com redutor e encoder. O controlador usa a cinemática inversa: dada a posição desejada da garra, calcula o ângulo de cada junta. A garra abre e fecha para pegar a peça. Neste modelo, a ferramenta se mantém na vertical enquanto o braço faz o ciclo de pegar e soltar.","Faz solda, pintura, manuseio de peças, paletização e montagem, principalmente nas indústrias automotiva e eletrônica. O mesmo robô muda de tarefa trocando a garra e o programa."],
"Serra de fita horizontal 3D":["Uma lâmina em fita (em laço) gira em dois volantes e passa por guias que a colocam em pé para cortar. O arco, articulado, desce sobre a barra presa na morsa, e um cilindro amortecedor controla a descida e o avanço. Os dentes cortam, e o passo deles (TPI) deve manter pelo menos 3 dentes em contato com a peça.","É a primeira máquina de quase toda usinagem: corta barras, tubos e perfis de aço, alumínio e inox no comprimento certo antes de usinar. Corta reto e com pouco desperdício, e há versões automáticas que cortam lotes inteiros sozinhas."],
"Compressor de pistão 3D":["O motor gira o virabrequim por correia. O pistão desce e aspira ar, sobe e o comprime, e o ar passa por uma válvula para o reservatório. Quando a pressão chega ao máximo, o pressostato desliga o motor, e quando cai ele liga de novo. A válvula de segurança abre se o pressostato falhar, e o dreno retira a água condensada.","Fornece ar comprimido para cilindros pneumáticos, ferramentas de impacto, pintura, limpeza e instrumentos. Para uso contínuo em fábricas, existem compressores de parafuso, com mais vazão."],
"Bomba de engrenagens 3D":["Duas engrenagens se encaixam dentro da carcaça. Ao girar, os dentes levam o óleo pela periferia, do lado da sucção até o lado da pressão, e o engrenamento impede que ele volte. A bomba entrega uma vazão quase constante. A pressão vem da resistência do circuito.","É a bomba mais comum em unidades hidráulicas de prensas, máquinas agrícolas, empilhadeiras e sistemas de lubrificação. É simples, robusta e barata, e serve bem para pressões médias."],
"Caixa de redução 3D":["Um pinhão pequeno aciona uma engrenagem maior, o que reduz a rotação e multiplica o torque. Neste modelo há dois estágios, e a relação total é o produto das relações de cada par (32/14 × 32/16 ≈ 4,57). O óleo lubrifica os dentes e ajuda a esfriar.","Fica entre o motor e a carga em esteiras, misturadores, elevadores, guindastes e extrusoras, porque os motores giram rápido e as máquinas precisam de rotação menor e mais força."],
"Fresadora CNC de pórtico 3D":["A ponte anda em Y sobre trilhos, o carro anda em X sobre a ponte e o eixo Z desce a fresa. O spindle, que é um motor de alta rotação refrigerado, gira a fresa, e a mesa prende a peça. Um programa CAM transforma o desenho em G-code.","Corta madeira, MDF, plásticos, alumínio e compósitos em marcenaria, comunicação visual, moldes, modelos e produção de peças. É comum em fábricas de móveis e em oficinas de protótipos."],
"Painel elétrico 3D":["A energia entra pelo disjuntor geral e passa pelo disjuntor-motor e pelo contator, que liga e desliga a carga por comando. O relé térmico protege contra sobrecarga e o inversor varia a frequência para controlar a rotação do motor. Tudo é montado em trilhos DIN, com fios em canaletas e bornes.","É o cérebro elétrico de toda máquina e linha de produção: comanda motores, válvulas e sensores. A manutenção industrial trabalha com painéis todos os dias, e por isso o esquema elétrico e a identificação dos fios são essenciais."],
"Servomotor com encoder 3D":["O rotor tem ímãs e é arrastado pelo campo das bobinas do estator, que o controlador energiza na ordem certa. O encoder é um disco com furos: o sensor óptico conta os pulsos e informa posição e velocidade ao controlador, que corrige o erro. Esse controle em malha fechada é o que dá precisão.","Move os eixos de máquinas CNC, robôs, embaladoras e impressoras industriais, sempre que é preciso posicionar rápido e com exatidão. Custa mais que um motor de passo, mas é mais rápido e não perde passos."]};

let tab='home',sub='torno',q='';
try{const[h1,h2]=location.hash.slice(1).split('?')[0].split('/');if(D[h1]){tab=h1;sub=D[h1].s[h2]?h2:(D[h1].s[OLDK[h2]]?OLDK[h2]:Object.keys(D[h1].s)[0])}else if(PS(h1))tab=h1}catch(_){}

 document.body.dataset.t=PS(tab)?'oficina':tab;
 const tabs=$('#tabs');tabs.innerHTML='';tabs.append(btn('tab','Início',tab==='home',()=>{q='';$('#q').value='';tab='home';render()},'#e9d7d3'));
 for(const k in D)tabs.append(btn('tab',D[k].nome,k===tab,()=>{q='';$('#q').value='';tab=k;sub=Object.keys(D[k].s)[0];render()},D[k].c));
 tabs.append(btn('tab','Modelos 3D',tab==='m3',()=>{q='';$('#q').value='';tab='m3';m3s=null;render()},'#c9a3ff'));tabs.append(btn('tab','★ Favoritos',tab==='fav',()=>{q='';$('#q').value='';tab='fav';render()},'#ffd24a'));tabs.append(btn('tab','Histórico',tab==='his',()=>{q='';$('#q').value='';tab='his';render()},'#9ad0ff'));
 const subs=$('#subs');subs.innerHTML='';
 if(!PS(tab)){let lg='';for(const k in D[tab].s){const s0=D[tab].s[k];if(s0.g&&s0.g!==lg){lg=s0.g;const sp=document.createElement('span');sp.className='sg';sp.textContent=lg;subs.append(sp)}subs.append(btn('chip',s0.nome,k===sub,()=>{q='';$('#q').value='';sub=k;render()}))}subs.append(btn('chip','☰ Índice',sub==='__idx',()=>{q='';$('#q').value='';sub='__idx';render()}))}

 if(tab==='his'&&!q){if(!HIS.length){const p=document.createElement('p');p.className='note';p.textContent='Nenhum cálculo salvo. Use o botão Salvar em uma calculadora.';m.append(p)}
  else{const cl=document.createElement('button');cl.className='wb';cl.textContent='Limpar histórico';cl.onclick=()=>{HIS.length=0;saveHis();render()};m.append(cl)}
  HIS.forEach((e,i)=>{const s=document.createElement('section');s.className='card wide';const h=document.createElement('h3');h.textContent=e.t;s.append(h);const p=document.createElement('p');p.className='note';p.textContent=e.d+' · entradas: '+e.i.join(', ');const o=document.createElement('p');o.textContent=e.o;s.append(p,o);
   const ab=document.createElement('button');ab.className='wb';ab.textContent='Abrir';ab.onclick=()=>{const l=locOf(e.t);if(!l)return;[tab,sub]=l.split('/');PEND={t:e.t,v:e.i};render();PEND=null};const ex=document.createElement('button');ex.className='wb';ex.textContent='Excluir';ex.onclick=()=>{HIS.splice(i,1);saveHis();render()};s.append(ab,ex);m.append(s)});
  try{history.replaceState(null,'','#his')}catch(_){}return}
 if(tab==='fav'&&!q){const ls=[];for(const a in D)for(const b in D[a].s)D[a].s[b].k.forEach(c=>{if(FAV.has(c.t))ls.push([a,c])});
  if(!ls.length){const p=document.createElement('p');p.className='note';p.textContent='Nenhum favorito ainda. Toque na estrela de um cartão para fixá-lo aqui.';m.append(p)}

  try{history.replaceState(null,'','#fav')}catch(_){}return}
 if(q){const n=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),z=n(q);let hit=0;
  for(const a in D)for(const b in D[a].s)D[a].s[b].k.forEach(c=>{if(n(c.t).includes(z)){hit++;const e=card(c);e.style.setProperty('--ac',D[a].c);m.append(e)}});
  if(!hit){const p=document.createElement('p');p.className='note';p.textContent='Nenhum cartão encontrado para "'+q+'".';m.append(p)}return}
 if(sub==='__idx'){idxV(m);return}
 D[tab].s[sub].k.forEach(c=>m.append(card(c)));
 try{history.replaceState(null,'','#'+tab+'/'+sub)}catch(_){}
}
function card(c){
 const el=document.createElement('section');el.className='card'+(c.w?' wide':'');
 const h=document.createElement('h3'),ht=document.createElement('span'),st=document.createElement('button'),sf=()=>{const on=FAV.has(c.t);st.textContent=on?'★':'☆';st.setAttribute('aria-pressed',on)};ht.textContent=c.t;{const bg=document.createElement('em');bg.className='bdg';bg.textContent=kind(c);ht.append(bg)}st.className='star';st.setAttribute('aria-label','Favoritar '+c.t);sf();st.onclick=()=>{FAV.has(c.t)?FAV.delete(c.t):FAV.add(c.t);saveFav();tab=='fav'?render():sf()};h.append(ht,st);el.append(h);
 if(IMG[c.t])el.insertAdjacentHTML('beforeend',IMG[c.t]);
 if(c.x){setTimeout(()=>c.x(el),0);return el}
 if(c.m||c.a){const b=document.createElement(c.m?'div':'canvas');el.append(b);
  if(c.m){b.className='v3';if(window.THREE)setTimeout(()=>init3D(b,c.m),0);else b.textContent='O modelo 3D precisa carregar o three.js. Conecte-se uma vez à internet; depois ele fica guardado para uso offline.'}
  else{b.className='cv';b.width=720;b.height=240;setTimeout(()=>initAn(b,c.a),0)}
  const p=document.createElement('p');p.className='note';p.textContent=c.n;el.append(p);
  if(c.m&&INFO3D[c.t]){const w=document.createElement('div');w.className='info3';[['Como funciona',INFO3D[c.t][0]],['Onde é usada na indústria',INFO3D[c.t][1]]].forEach(([t,x])=>{const d=document.createElement('details'),sm=document.createElement('summary'),q2=document.createElement('p');d.open=true;sm.textContent=t;q2.textContent=x;d.append(sm,q2);w.append(d)});el.append(w)}return el}
 if(c.h){const d=document.createElement('div');d.className='ref';d.innerHTML=c.h;el.append(d);d.querySelectorAll('.ck input').forEach((i,n)=>{const key='ck:'+c.t+':'+n;try{i.checked=localStorage.getItem(key)=='1'}catch(_){}i.onchange=()=>{try{i.checked?localStorage.setItem(key,'1'):localStorage.removeItem(key)}catch(_){}}});return el}
 const cvt=UN=='pol'&&!c.nu,out=document.createElement('div');out.className='out';
 c.i.forEach(([k,l,def,opts])=>{
  const isMM=cvt&&/\(mm(?![²³])/.test(l),lb=document.createElement('label');lb.append(isMM?l.replace(/\(mm(?![²³])/,'(pol'):l);
  let inp;
  if(opts){inp=document.createElement('select');opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(v==def)o.selected=true;inp.append(o)})}
  else{inp=document.createElement('input');inp.type='number';inp.step='any';inp.value=isMM?+(def/25.4).toFixed(4):def;if(isMM)inp.dataset.mm='1'}
  inp.dataset.k=k;inp.oninput=calc;{const pv=PEND&&PEND.t==c.t?PEND.v[c.i.findIndex(z=>z[0]==k)]:undefined;if(pv!==undefined&&pv!=='')inp.value=pv}lb.append(inp);el.append(lb)
 });
 function calc(){
  const v={};el.querySelectorAll('[data-k]').forEach(i=>v[i.dataset.k]=parseFloat(i.value)*(i.dataset.mm?25.4:1));
  out.innerHTML='';
  c.fn(v).forEach(([l,r])=>{const d=document.createElement('div');d.append(l);const b=document.createElement('b');b.textContent=cvt?toIn(r):r;d.append(b);out.append(d)})
 }
 el.append(out);
 if(c.n){const n=document.createElement('p');n.className='note';n.textContent=c.n;el.append(n)}
 calc();{const cb=document.createElement('button');cb.className='wb cp';cb.textContent='Copiar';cb.onclick=()=>cpy(c.t+': '+[...out.children].map(d=>d.firstChild.textContent+' '+d.lastChild.textContent).join(' | '),cb);el.append(cb);{const vs=()=>[...el.querySelectorAll('[data-k]')].map(i=>i.value),sb=document.createElement('button'),lk=document.createElement('button');sb.className=lk.className='wb cp';sb.textContent='Salvar';lk.textContent='Link';
 sb.onclick=()=>{HIS.unshift({t:c.t,d:hoje(),i:vs(),o:[...out.children].map(d=>d.firstChild.textContent+' '+d.lastChild.textContent).join(' | ')});saveHis();sb.textContent='Salvo'};
 lk.onclick=()=>cpy(location.href.split('#')[0]+'#'+locOf(c.t)+'?t='+encodeURIComponent(c.t)+'&v='+vs().join(','),lk);el.append(sb,lk)}}return el
}
